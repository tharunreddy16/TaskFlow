<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager App</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'DM Sans', system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    // Mock the import statement
    window.ReactModule = React;
  </script>
  <script type="text/babel">
    // Load the component file via fetch and execute it
    fetch('TaskManager_App.jsx')
      .then(response => response.text())
      .then(code => {
        // Remove import/export statements
        let modifiedCode = code
          .replace(/import\s+.*?from\s+['"]react['"];/g, 'const { useState, useEffect, createContext, useContext, useCallback } = React;')
          .replace(/export\s+default\s+function\s+App/g, 'function App');
        
        modifiedCode += `\n\nconst root = ReactDOM.createRoot(document.getElementById('root'));\nroot.render(<App />);`;

        // Transpile and execute
        const transpiledCode = Babel.transform(modifiedCode, { presets: ['react', 'env'] }).code;
        const script = document.createElement('script');
        script.innerHTML = transpiledCode;
        document.body.appendChild(script);
      });
  </script>
</body>
</html>
